<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D건축인테리어과 실내건축산업기사 문제 은행</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; line-height: 1.5; }
        .container { max-width: 760px; margin: 20px auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #2c3e50; margin-top: 0; margin-bottom: 25px; font-size: 26px; }
        
        .filter-group { margin-bottom: 18px; background: #fafafa; padding: 16px; border-radius: 8px; border: 1px solid #e9ecef; }
        .filter-title { font-weight: bold; margin-bottom: 10px; color: #34495e; display: block; font-size: 15px; }
        .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
        label { font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; user-select: none; }
        
        .start-section { margin-top: 25px; text-align: center; background: #eef6fc; padding: 20px; border-radius: 8px; border: 1px solid #d0e3f7; }
        .question-count-badge { font-size: 18px; font-weight: bold; color: #2980b9; margin-bottom: 12px; display: block; }
        .btn-start { background-color: #3498db; color: white; border: none; padding: 14px 28px; font-size: 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; width: 100%; max-width: 300px; }
        .btn-start:hover { background-color: #2980b9; }

        /* Quiz Interface */
        .quiz-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 12px; margin-bottom: 20px; }
        .progress-text { font-weight: bold; color: #34495e; font-size: 16px; }
        .timer-badge { background: #ffeaa7; color: #d63031; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 5px; }
        
        .badges { margin-bottom: 12px; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; background: #e0e0e0; margin-right: 5px; }
        .badge-unit { background: #e1f5fe; color: #0288d1; }
        .badge-type { background: #f3e5f5; color: #7b1fa2; }
        .badge-tag { background: #fff3e0; color: #e65100; }
        
        .question-text { font-size: 18px; font-weight: 600; color: #2c3e50; margin-bottom: 20px; line-height: 1.6; }
        
        #q-options-container { margin-bottom: 25px; }
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: #fff; border: 1.5px solid #dcdfe6; padding: 14px 18px; border-radius: 8px; text-align: left; font-size: 15px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .option-btn:hover { background: #f5f7fa; border-color: #c0c4cc; }
        .option-btn.selected { background: #e8f4ff; border-color: #3498db; font-weight: bold; color: #2980b9; }
        
        .input-text { width: 100%; padding: 14px; border: 1.5px solid #dcdfe6; border-radius: 8px; font-size: 15px; outline: none; }
        .input-text:focus { border-color: #3498db; }

        /* 단일 문제 채점 피드백 박스 */
        .instant-feedback-box { padding: 16px; border-radius: 8px; margin-bottom: 25px; font-size: 15px; line-height: 1.5; display: none; }
        .instant-feedback-box.correct { background-color: #e8f8f5; border: 1.5px solid #2ecc71; color: #27ae60; }
        .instant-feedback-box.incorrect { background-color: #fdedec; border: 1.5px solid #e74c3c; color: #c0392b; }
        
        .nav-buttons { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; }
        .btn { padding: 12px 14px; border-radius: 8px; font-size: 14px; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; }
        .btn-prev { background: #95a5a6; color: white; }
        .btn-prev:hover { background: #7f8c8d; }
        .btn-skip-next { background: #7f8c8d; color: white; flex-grow: 1; }
        .btn-skip-next:hover { background: #6c7a7d; }
        .btn-check-next { background: #e67e22; color: white; flex-grow: 1; }
        .btn-check-next:hover { background: #d35400; }
        .btn-move-next { background: #3498db; color: white; flex-grow: 1; }
        .btn-move-next:hover { background: #2980b9; }

        /* 백그라운드 카드 밖 하단 텍스트 버튼 */
        .early-exit-wrapper { text-align: center; margin-top: 15px; }
        .btn-text-exit { background: none; border: none; color: #888; font-size: 13px; text-decoration: underline; cursor: pointer; padding: 5px 10px; transition: 0.2s; }
        .btn-text-exit:hover { color: #555; }

        /* Result View */
        .summary-card { background: #f8f9fa; border-radius: 8px; padding: 20px; text-align: center; margin-bottom: 25px; border: 1px solid #e9ecef; }
        .score-num { font-size: 32px; font-weight: bold; color: #2c3e50; }
        
        .result-item { border: 1px solid #e0e0e0; border-radius: 8px; padding: 18px; margin-bottom: 15px; background: #fff; }
        .result-item.correct-item { border-left: 6px solid #2ecc71; }
        .result-item.incorrect-item { border-left: 6px solid #e74c3c; }
        .time-tag { float: right; font-size: 12px; background: #edf2f7; color: #4a5568; padding: 3px 8px; border-radius: 12px; font-weight: normal; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>📝3D건축인테리어과 실내건축산업기사 문제 은행</h1>
    
    <!-- 1. 설정 및 필터 화면 -->
    <div id="setup-screen">
        <div class="filter-group">
            <span class="filter-title">1. 문제 유형 선택 (미선택 시 전체)</span>
            <div class="checkbox-grid">
                <label><input type="checkbox" name="type" value="객관식" onchange="updateAvailableCount()"> 객관식</label>
                <label><input type="checkbox" name="type" value="OX" onchange="updateAvailableCount()"> OX</label>
                <label><input type="checkbox" name="type" value="단답형" onchange="updateAvailableCount()"> 단답형</label>
            </div>
        </div>

        <div class="filter-group">
            <span class="filter-title">2. 능력단위 선택 (미선택 시 전체)</span>
            <div class="checkbox-grid">
                <label><input type="checkbox" name="unit" value="색채계획" onchange="updateAvailableCount()"> 색채계획</label>
                <label><input type="checkbox" name="unit" value="가구계획" onchange="updateAvailableCount()"> 가구계획</label>
                <label><input type="checkbox" name="unit" value="기본계획" onchange="updateAvailableCount()"> 기본계획</label>
                <label><input type="checkbox" name="unit" value="마감계획" onchange="updateAvailableCount()"> 마감계획</label>
                <label><input type="checkbox" name="unit" value="조명계획" onchange="updateAvailableCount()"> 조명계획</label>
                <label><input type="checkbox" name="unit" value="설비계획" onchange="updateAvailableCount()"> 설비계획</label>
                <label><input type="checkbox" name="unit" value="자료조사분석" onchange="updateAvailableCount()"> 자료조사분석</label>
                <label><input type="checkbox" name="unit" value="시각화작업" onchange="updateAvailableCount()"> 시각화작업</label>
            </div>
        </div>

        <div class="filter-group">
            <span class="filter-title">3. 특징 선택 (미선택 시 전체)</span>
            <div class="checkbox-grid">
                <label><input type="checkbox" name="tag" value="기초" onchange="updateAvailableCount()"> 기초</label>
                <label><input type="checkbox" name="tag" value="심화" onchange="updateAvailableCount()"> 심화</label>
                <label><input type="checkbox" name="tag" value="학생출제" onchange="updateAvailableCount()"> 학생출제</label>
                <label><input type="checkbox" name="tag" value="기출" onchange="updateAvailableCount()"> 기출</label>
            </div>
        </div>

        <div class="start-section">
            <span class="question-count-badge" id="count-display">풀 수 있는 문제: 0개</span>
            <button class="btn-start" onclick="startQuiz()">문제 풀기 시작</button>
        </div>
    </div>

    <!-- 2. 한 문제씩 풀어가는 풀이 화면 -->
    <div id="quiz-screen" class="hidden">
        <div class="quiz-header">
            <span class="progress-text" id="progress-text">문제 1 / 10</span>
            <div class="timer-badge">⏱️ <span id="current-question-timer">00:00</span></div>
        </div>

        <div class="badges">
            <span class="badge badge-unit" id="q-unit"></span>
            <span class="badge badge-type" id="q-type"></span>
            <span class="badge badge-tag" id="q-tag"></span>
        </div>

        <div class="question-text" id="q-question"></div>

        <div id="q-options-container"></div>

        <!-- 단일 문제 채점 피드백 영역 -->
        <div class="instant-feedback-box" id="feedback-box"></div>

        <div class="nav-buttons">
            <button class="btn btn-prev" id="btn-prev" onclick="prevQuestion()">이전 문제</button>
            <button class="btn btn-skip-next" id="btn-skip" onclick="skipToNext()">다음 문제</button>
            <button class="btn btn-check-next" id="btn-action" onclick="handleAction()">채점 후 다음 문제</button>
        </div>
    </div>

    <!-- 3. 최종 결과 화면 -->
    <div id="result-screen" class="hidden">
        <div class="summary-card">
            <h2>🎉 수고하셨습니다!</h2>
            <h4>틀린 문제 속 키워드를 PDF에서 검색해</h4>
            <h4>정답의 근거를 꼭 확인하세요.</h4>
            <div class="score-num"><span id="final-score">0</span> / <span id="final-total">0</span></div>
            <p style="color:#666; margin-top:5px;" id="total-time-text"></p>
        </div>

        <h3>📋 상세 결과 및 문제별 소요시간</h3>
        <div id="result-details"></div>

        <button class="btn btn-start" style="width:100%; max-width:100%; margin-top:20px;" onclick="location.reload()">새로운 옵션으로 다시 풀기</button>
    </div>
</div>

<!-- 백그라운드 카드 바깥 하단 저위계 버튼 -->
<div id="early-exit-area" class="early-exit-wrapper hidden">
    <button class="btn-text-exit" onclick="confirmEarlySubmit()">풀이 중지 후 채점</button>
</div>

<script>
let allQuestions = [];
let selectedQuestions = [];
let currentIndex = 0;
let userAnswers = [];
let questionTimes = [];
let visitedQuestions = []; // 새로 추가: 방문(노출)된 문제 인덱스를 기록하는 배열
let timerInterval = null;
let currentQuestionTime = 0;
let isGradedCurrent = false;

fetch('questions.json')
    .then(res => res.json())
    .then(data => { 
        allQuestions = data; 
        updateAvailableCount();
    })
    .catch(err => alert("questions.json 파일을 불러오지 못했습니다. 파일 이름을 확인해주세요."));

function getFilteredQuestions() {
    const types = Array.from(document.querySelectorAll('input[name="type"]:checked')).map(e => e.value);
    const units = Array.from(document.querySelectorAll('input[name="unit"]:checked')).map(e => e.value);
    const tags = Array.from(document.querySelectorAll('input[name="tag"]:checked')).map(e => e.value);

    return allQuestions.filter(q => {
        const matchType = types.length === 0 || types.includes(q.type);
        const matchUnit = units.length === 0 || units.includes(q.unit);
        const matchTag = tags.length === 0 || tags.includes(q.tag);
        return matchType && matchUnit && matchTag;
    });
}

function updateAvailableCount() {
    const filtered = getFilteredQuestions();
    document.getElementById('count-display').innerText = `풀 수 있는 문제: ${filtered.length}개`;
}

function startQuiz() {
    const filtered = getFilteredQuestions();
    if (filtered.length === 0) {
        alert("선택하신 조건에 해당하는 문제가 없습니다. 옵션을 변경해보세요!");
        return;
    }

    selectedQuestions = [...filtered].sort(() => Math.random() - 0.5);
    userAnswers = new Array(selectedQuestions.length).fill("");
    questionTimes = new Array(selectedQuestions.length).fill(0);
    visitedQuestions = new Array(selectedQuestions.length).fill(false); // 초기화

    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    document.getElementById('early-exit-area').classList.remove('hidden');

    currentIndex = 0;
    loadQuestion(currentIndex);
}

function startTimer() {
    stopTimer();
    currentQuestionTime = questionTimes[currentIndex] || 0;
    updateTimerDisplay();
    timerInterval = setInterval(() => {
        currentQuestionTime++;
        questionTimes[currentIndex] = currentQuestionTime;
        updateTimerDisplay();
    }, 1000);
}

function stopTimer() {
    if (timerInterval) clearInterval(timerInterval);
}

function updateTimerDisplay() {
    const min = String(Math.floor(currentQuestionTime / 60)).padStart(2, '0');
    const sec = String(currentQuestionTime % 60).padStart(2, '0');
    document.getElementById('current-question-timer').innerText = `${min}:${sec}`;
}

function saveCurrentAnswer() {
    const q = selectedQuestions[currentIndex];
    if (q.type === '객관식' || q.type === 'OX') {
        const selected = document.querySelector('input[name="current_option"]:checked');
        if (selected) userAnswers[currentIndex] = selected.value;
    } else if (q.type === '단답형') {
        const input = document.getElementById('short-answer-input');
        if (input) userAnswers[currentIndex] = input.value.trim();
    }
}

function loadQuestion(index) {
    stopTimer();
    isGradedCurrent = false;

    // 현재 문제를 마주했으므로 방문 기록 체크
    visitedQuestions[index] = true;

    const q = selectedQuestions[index];
    const isLast = (index === selectedQuestions.length - 1);

    document.getElementById('progress-text').innerText = `문제 ${index + 1} / ${selectedQuestions.length}`;
    document.getElementById('q-unit').innerText = q.unit;
    document.getElementById('q-type').innerText = q.type;
    document.getElementById('q-tag').innerText = q.tag;
    document.getElementById('q-question').innerText = `Q${index + 1}. ${q.question}`;

    const container = document.getElementById('q-options-container');
    container.innerHTML = '';

    const currentAns = userAnswers[index];

    if (q.type === '객관식') {
        q.options.forEach((opt, idx) => {
            const isChecked = currentAns === opt ? 'checked' : '';
            const isSelectedClass = currentAns === opt ? 'selected' : '';
            container.innerHTML += `
                <label class="option-btn ${isSelectedClass}" onclick="selectOption(this)">
                    <input type="radio" name="current_option" value="${opt}" ${isChecked} onchange="saveCurrentAnswer()" style="display:none;">
                    <span>${idx + 1}. ${opt}</span>
                </label>
            `;
        });
    } else if (q.type === 'OX') {
        ['O', 'X'].forEach(opt => {
            const isChecked = currentAns === opt ? 'checked' : '';
            const isSelectedClass = currentAns === opt ? 'selected' : '';
            container.innerHTML += `
                <label class="option-btn ${isSelectedClass}" onclick="selectOption(this)">
                    <input type="radio" name="current_option" value="${opt}" ${isChecked} onchange="saveCurrentAnswer()" style="display:none;">
                    <span>${opt}</span>
                </label>
            `;
        });
    } else if (q.type === '단답형') {
        container.innerHTML = `
            <input type="text" id="short-answer-input" class="input-text" value="${currentAns}" placeholder="정답을 입력하세요" oninput="saveCurrentAnswer()">
        `;
    }

    const feedbackBox = document.getElementById('feedback-box');
    feedbackBox.style.display = 'none';
    feedbackBox.className = 'instant-feedback-box';

    document.getElementById('btn-prev').disabled = (index === 0);
    document.getElementById('btn-prev').style.opacity = (index === 0) ? '0.5' : '1';

    const skipBtn = document.getElementById('btn-skip');
    const actionBtn = document.getElementById('btn-action');

    skipBtn.classList.remove('hidden');

    if (isLast) {
        skipBtn.innerText = "최종 제출";
        actionBtn.innerText = "채점 후 제출";
    } else {
        skipBtn.innerText = "다음 문제";
        actionBtn.innerText = "채점 후 다음 문제";
    }
    actionBtn.className = "btn btn-check-next";

    startTimer();
}

function selectOption(el) {
    if (isGradedCurrent) return;
    const labels = document.querySelectorAll('.option-btn');
    labels.forEach(l => l.classList.remove('selected'));
    el.classList.add('selected');
    const radio = el.querySelector('input[type="radio"]');
    if (radio) {
        radio.checked = true;
        saveCurrentAnswer();
    }
}

function skipToNext() {
    saveCurrentAnswer();
    const isLast = (currentIndex === selectedQuestions.length - 1);
    
    if (isLast) {
        finishQuiz();
    } else {
        currentIndex++;
        loadQuestion(currentIndex);
    }
}

function checkIsCorrect(userAns, q) {
    if (!userAns) return false;
    
    const cleanUserAns = userAns.toString().replace(/\s+/g, '').toLowerCase();
    const rawAnswer = q.answer;

    let possibleAnswers = [];
    if (Array.isArray(rawAnswer)) {
        possibleAnswers = rawAnswer.map(ans => ans.toString());
    } else if (typeof rawAnswer === 'string' && rawAnswer.includes(',')) {
        possibleAnswers = rawAnswer.split(',').map(ans => ans.trim());
    } else {
        possibleAnswers = [rawAnswer.toString()];
    }

    if (q.type === '객관식' && q.options) {
        const numIdx = Number(rawAnswer);
        if (!isNaN(numIdx) && numIdx >= 1 && numIdx <= q.options.length) {
            possibleAnswers.push(q.options[numIdx - 1]);
        }
    } else if (q.type === 'OX') {
        const numIdx = Number(rawAnswer);
        if (numIdx === 1) possibleAnswers.push('O');
        if (numIdx === 2) possibleAnswers.push('X');
    }

    return possibleAnswers.some(ans => {
        return cleanUserAns === ans.replace(/\s+/g, '').toLowerCase();
    });
}

function handleAction() {
    saveCurrentAnswer();
    const uAns = userAnswers[currentIndex] || "";
    const isLast = (currentIndex === selectedQuestions.length - 1);
    
    if (!isGradedCurrent) {
        const q = selectedQuestions[currentIndex];
        const isCorrect = checkIsCorrect(uAns, q);
        
        const feedbackBox = document.getElementById('feedback-box');
        feedbackBox.style.display = 'block';
        
        let displayAnswer = q.answer;
        if (q.type === '객관식' && !isNaN(Number(q.answer)) && q.options) {
            const idx = Number(q.answer) - 1;
            if (q.options[idx]) displayAnswer = `${q.answer}. ${q.options[idx]}`;
        } else if (q.type === 'OX' && Number(q.answer) === 1) {
            displayAnswer = 'O';
        } else if (q.type === 'OX' && Number(q.answer) === 2) {
            displayAnswer = 'X';
        }

        if (isCorrect) {
            feedbackBox.className = 'instant-feedback-box correct';
            feedbackBox.innerHTML = `<b>⭕ 정답입니다!</b><br>선택한 답: ${uAns}`;
        } else {
            feedbackBox.className = 'instant-feedback-box incorrect';
            feedbackBox.innerHTML = `<b>❌ 오답입니다.</b><br>제출한 답: ${uAns || '<span style="color:#999;">(미입력)</span>'}<br><b>정답: ${displayAnswer}</b>`;
        }

        document.getElementById('btn-skip').classList.add('hidden');

        const actionBtn = document.getElementById('btn-action');
        if (isLast) {
            actionBtn.innerText = "최종 제출 ▶";
        } else {
            actionBtn.innerText = "다음 문제 ▶";
        }
        actionBtn.className = "btn btn-move-next";
        isGradedCurrent = true;
    } else {
        if (isLast) {
            finishQuiz();
        } else {
            currentIndex++;
            loadQuestion(currentIndex);
        }
    }
}

function prevQuestion() {
    saveCurrentAnswer();
    if (currentIndex > 0) {
        currentIndex--;
        loadQuestion(currentIndex);
    }
}

function confirmEarlySubmit() {
    if (confirm("풀이를 중지하고 지금까지 푼 상태로 결과를 확인하시겠습니까?")) {
        finishQuiz();
    }
}

function finishQuiz() {
    saveCurrentAnswer();
    stopTimer();

    let score = 0;
    
    // 방문(노출)했던 문제들만 필터링하여 총 소요시간 및 상세 결과 계산
    let activeQuestionCount = 0;
    let totalSec = 0;

    selectedQuestions.forEach((q, idx) => {
        if (visitedQuestions[idx]) {
            totalSec += questionTimes[idx];
        }
    });

    const detailsContainer = document.getElementById('result-details');
    detailsContainer.innerHTML = '';

    selectedQuestions.forEach((q, idx) => {
        // 화면에 한 번이라도 노출된 적 있는 문제만 결과에 포함
        if (!visitedQuestions[idx]) return;

        activeQuestionCount++;
        const uAns = userAnswers[idx] || "";
        const isCorrect = checkIsCorrect(uAns, q);
        
        if (isCorrect) score++;

        const sec = questionTimes[idx];
        const timeStr = sec >= 60 ? `${Math.floor(sec/60)}분 ${sec%60}초` : `${sec}초`;

        let displayAnswer = q.answer;
        if (q.type === '객관식' && !isNaN(Number(q.answer)) && q.options) {
            const optIdx = Number(q.answer) - 1;
            if (q.options[optIdx]) displayAnswer = `${q.answer}. ${q.options[optIdx]}`;
        } else if (q.type === 'OX' && Number(q.answer) === 1) {
            displayAnswer = 'O';
        } else if (q.type === 'OX' && Number(q.answer) === 2) {
            displayAnswer = 'X';
        }

        detailsContainer.innerHTML += `
            <div class="result-item ${isCorrect ? 'correct-item' : 'incorrect-item'}">
                <div>
                    <span class="badge badge-unit">${q.unit}</span>
                    <span class="badge badge-type">${q.type}</span>
                    <span class="time-tag">⏱️ 풀이시간: ${timeStr}</span>
                </div>
                <h4 style="margin: 10px 0 8px 0; font-size:16px;">Q${idx + 1}. ${q.question}</h4>
                <div style="font-size:14px; line-height:1.6;">
                    ${isCorrect ? '<b style="color:#2ecc71;">⭕ 정답입니다!</b>' : '<b style="color:#e74c3c;">❌ 오답입니다.</b>'}<br>
                    <b>내가 작성한 답:</b> ${uAns || '<span style="color:#999;">(미제출)</span>'}<br>
                    <b>실제 정답:</b> <span style="color:#27ae60; font-weight:bold;">${displayAnswer}</span>
                </div>
            </div>
        `;
    });

    document.getElementById('final-score').innerText = score;
    document.getElementById('final-total').innerText = activeQuestionCount; // 푼 문제 수 기준 총점
    
    const totalMin = Math.floor(totalSec / 60);
    const totalRemSec = totalSec % 60;
    document.getElementById('total-time-text').innerText = `총 소요 시간: ${totalMin > 0 ? totalMin + '분 ' : ''}${totalRemSec}초`;

    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('early-exit-area').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>

</body>
</html>
