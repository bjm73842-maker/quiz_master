<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문제 은행 플랫폼</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .filter-group { margin-bottom: 20px; background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #eee; }
        .filter-title { font-weight: bold; margin-bottom: 10px; color: #34495e; display: block; }
        .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
        label { font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        select, button { padding: 10px 15px; border-radius: 6px; border: 1px solid #ccc; font-size: 15px; }
        .btn-start { background-color: #3498db; color: white; border: none; width: 100%; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 15px; }
        .btn-start:hover { background-color: #2980b9; }
        .question-card { border-bottom: 1px solid #eee; padding: 20px 0; }
        .question-card:last-child { border-bottom: none; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; background: #e0e0e0; margin-right: 5px; }
        .options { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
        .input-text { width: 95%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .result-box { margin-top: 15px; padding: 12px; border-radius: 6px; font-weight: bold; display: none; }
        .correct { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .incorrect { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .btn-submit { background-color: #2ecc71; color: white; border: none; width: 100%; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 20px; }
        .btn-submit:hover { background-color: #27ae60; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 맞춤형 문제 은행</h1>
    
    <div id="setup-screen">
        <div class="filter-group">
            <span class="filter-title">1. 문제 유형 선택 (미선택 시 전체)</span>
            <div class="checkbox-grid">
                <label><input type="checkbox" name="type" value="객관식"> 객관식</label>
                <label><input type="checkbox" name="type" value="OX"> OX</label>
                <label><input type="checkbox" name="type" value="단답형"> 단답형</label>
            </div>
        </div>

        <div class="filter-group">
            <span class="filter-title">2. 능력단위 선택 (미선택 시 전체)</span>
            <div class="checkbox-grid">
                <label><input type="checkbox" name="unit" value="색채계획"> 색채계획</label>
                <label><input type="checkbox" name="unit" value="가구계획"> 가구계획</label>
                <label><input type="checkbox" name="unit" value="기본계획"> 기본계획</label>
                <label><input type="checkbox" name="unit" value="마감계획"> 마감계획</label>
                <label><input type="checkbox" name="unit" value="조명계획"> 조명계획</label>
                <label><input type="checkbox" name="unit" value="설비계획"> 설비계획</label>
                <label><input type="checkbox" name="unit" value="자료조사분석"> 자료조사분석</label>
                <label><input type="checkbox" name="unit" value="시각화작업"> 시각화작업</label>
            </div>
        </div>

        <div class="filter-group">
            <span class="filter-title">3. 특징 선택 (미선택 시 전체)</span>
            <div class="checkbox-grid">
                <label><input type="checkbox" name="tag" value="기초"> 기초</label>
                <label><input type="checkbox" name="tag" value="심화"> 심화</label>
                <label><input type="checkbox" name="tag" value="학생출제"> 학생출제</label>
                <label><input type="checkbox" name="tag" value="기출"> 기출</label>
            </div>
        </div>

        <div class="filter-group">
            <span class="filter-title">4. 풀 문제 수</span>
            <select id="count-select">
                <option value="10">10 문제</option>
                <option value="20">20 문제</option>
            </select>
        </div>

        <button class="btn-start" onclick="startQuiz()">문제 풀기 시작</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div id="questions-container"></div>
        <button id="submit-btn" class="btn-submit" onclick="gradeQuiz()">제출 및 채점하기</button>
        <button id="retry-btn" class="btn-start hidden" onclick="location.reload()">새로운 문제 풀기</button>
    </div>
</div>

<script>
let allQuestions = [];
let selectedQuestions = [];

fetch('questions.json')
    .then(res => res.json())
    .then(data => { allQuestions = data; })
    .catch(err => alert("문제 데이터를 불러오는 데 실패했습니다. questions.json 파일을 확인해주세요."));

function startQuiz() {
    const types = Array.from(document.querySelectorAll('input[name="type"]:checked')).map(e => e.value);
    const units = Array.from(document.querySelectorAll('input[name="unit"]:checked')).map(e => e.value);
    const tags = Array.from(document.querySelectorAll('input[name="tag"]:checked')).map(e => e.value);
    const count = parseInt(document.getElementById('count-select').value);

    let filtered = allQuestions.filter(q => {
        const matchType = types.length === 0 || types.includes(q.type);
        const matchUnit = units.length === 0 || units.includes(q.unit);
        const matchTag = tags.length === 0 || tags.includes(q.tag);
        return matchType && matchUnit && matchTag;
    });

    if (filtered.length === 0) {
        alert("선택한 조건에 해당하는 문제가 없습니다!");
        return;
    }

    filtered.sort(() => Math.random() - 0.5);
    selectedQuestions = filtered.slice(0, count);

    renderQuestions();
    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
}

function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    selectedQuestions.forEach((q, idx) => {
        let optionsHtml = '';
        if (q.type === '객관식') {
            optionsHtml = `<div class="options">
                ${q.options.map((opt, i) => `<label><input type="radio" name="q_${idx}" value="${opt}"> ${i+1}. ${opt}</label>`).join('')}
            </div>`;
        } else if (q.type === 'OX') {
            optionsHtml = `<div class="options">
                <label><input type="radio" name="q_${idx}" value="O"> O</label>
                <label><input type="radio" name="q_${idx}" value="X"> X</label>
            </div>`;
        } else if (q.type === '단답형') {
            optionsHtml = `<div class="options" style="margin-top:8px;">
                <input type="text" class="input-text" id="input_${idx}" placeholder="정답을 입력하세요">
            </div>`;
        }

        container.innerHTML += `
            <div class="question-card" id="card_${idx}">
                <div>
                    <span class="badge">${q.unit}</span>
                    <span class="badge" style="background:#d0e6ff">${q.type}</span>
                    <span class="badge" style="background:#ffe0b2">${q.tag}</span>
                </div>
                <h3>Q${idx + 1}. ${q.question}</h3>
                ${optionsHtml}
                <div class="result-box" id="result_${idx}"></div>
            </div>
        `;
    });
}

function gradeQuiz() {
    let score = 0;

    selectedQuestions.forEach((q, idx) => {
        let userAnswer = "";
        if (q.type === '객관식' || q.type === 'OX') {
            const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
            if (selected) userAnswer = selected.value;
        } else if (q.type === '단답형') {
            const input = document.getElementById(`input_${idx}`);
            if (input) userAnswer = input.value.trim();
        }

        const resultBox = document.getElementById(`result_${idx}`);
        resultBox.style.display = 'block';

        const isCorrect = userAnswer.replace(/\s+/g, '').toLowerCase() === q.answer.toString().replace(/\s+/g, '').toLowerCase();

        if (isCorrect) {
            score++;
            resultBox.className = "result-box correct";
            resultBox.innerHTML = `⭕ 정답입니다!`;
        } else {
            resultBox.className = "result-box incorrect";
            resultBox.innerHTML = `❌ 오답입니다. <br><b>내 제출:</b> ${userAnswer || '(미제출)'}<br><b>정답:</b> ${q.answer}`;
        }
    });

    alert(`총 ${selectedQuestions.length}문제 중 ${score}문제를 맞히셨습니다!`);
    document.getElementById('submit-btn').classList.add('hidden');
    document.getElementById('retry-btn').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>

</body>
</html>
